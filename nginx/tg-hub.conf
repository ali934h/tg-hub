# /etc/nginx/conf.d/tg-hub.conf
# Generated by install.sh — do not edit manually.

server {
    listen 80;
    server_name __HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name __HOST__;

    ssl_certificate     __SSL_FULLCHAIN__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 0;

    # Static file downloads — served straight from disk by nginx.
    # Node never touches these bytes.
    location /files/ {
        alias __SERVE_DIR__/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition "attachment";

        # Hide sidecar .json metadata and .tmp partials
        location ~ /\. {
            deny all;
        }
        location ~ \.json$ {
            deny all;
        }
    }

    # Health check — proxied to Node
    location = /health {
        proxy_pass         http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
